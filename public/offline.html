<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#020617" />
    <title>Offline | Emad Dev Blog</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        font-family: "Space Grotesk", system-ui, -apple-system, sans-serif;
        background: #0f172a;
        color: #e2e8f0;
      }
      .wrap {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2.5rem 1.5rem;
        text-align: center;
      }
      .card {
        max-width: 32rem;
        width: 100%;
        background: rgba(15, 23, 42, 0.85);
        border: 1px solid rgba(148, 163, 184, 0.2);
        border-radius: 1.25rem;
        padding: 2rem;
        box-shadow: 0 20px 50px -30px rgba(15, 23, 42, 0.8);
      }
      h1 {
        margin: 0 0 0.75rem;
        font-size: 1.75rem;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0 0 1.25rem;
        color: #cbd5f5;
        line-height: 1.6;
      }
      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0.6rem 1.2rem;
        border-radius: 999px;
        text-decoration: none;
        background: #38bdf8;
        color: #0f172a;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="card">
        <h1>You are offline</h1>
        <p>
          This page is not available offline yet. Reconnect to load more content or
          return to your last visited pages.
        </p>
        <a href="./">Go back home</a>
      </div>
    </div>
  </body>
</html>
