name: News sync

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

concurrency:
  group: news-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger news-sync Edge Function
        env:
          NEWS_SYNC_URL: ${{ secrets.NEWS_SYNC_URL }}
          NEWS_SYNC_SECRET: ${{ secrets.NEWS_SYNC_SECRET }}
        run: |
          if [ -z "$NEWS_SYNC_URL" ] || [ -z "$NEWS_SYNC_SECRET" ]; then
            echo "Missing NEWS_SYNC_URL or NEWS_SYNC_SECRET repository secrets."
            exit 1
          fi
          curl -fsS -X POST "$NEWS_SYNC_URL" \
            -H "Content-Type: application/json" \
            -H "x-sync-secret: $NEWS_SYNC_SECRET" \
            -d '{}'
